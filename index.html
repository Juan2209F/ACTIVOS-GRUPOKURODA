<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Supabase - Control de Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root{
            --bg:#f8f9fc; --white:#ffffff;
            --border:#eef1f7; --txt:#344767; --muted:#8392ab;
            --blue:#5e72e4; --blue2:#825ee4; --blue-soft:#eef0fd;
            --green:#2dce89; --green-soft:#e6f9f1;
            --red:#f5365c; --red-soft:#fde8ec;
            --amber:#fbb140; --amber-soft:#fff8e9;
            --radius:18px; --radius-sm:12px;
            --shadow:0 20px 27px 0 rgba(0,0,0,.05);
            --shadow-colored:0 4px 20px 0 rgba(0,0,0,.14),0 7px 10px -5px rgba(94,114,228,.4);
        }
        body {
            font-family: 'Poppins', 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--txt);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: var(--white);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            transition: max-width 0.3s ease;
        }
        #app-view { max-width: 800px; }
        h2, h3 { margin-bottom: 20px; color: var(--txt); text-align: center; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg);
            color: var(--txt);
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px var(--blue-soft);
        }
        button {
            background: linear-gradient(135deg, var(--blue), var(--blue2));
            color: white;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-colored);
            transition: box-shadow 0.2s, transform 0.1s;
            font-family: inherit;
        }
        button:hover { box-shadow: 0 6px 18px -2px rgba(94,114,228,.55); }
        button:active { transform: scale(.98); }
        button:disabled {
            background: var(--muted);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* --- Card de login con borde animado (paleta del dashboard) --- */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        #login-view {
            max-width: 420px;
            padding: 2px;
            border-radius: 20px;
            background: conic-gradient(from var(--angle), var(--blue), var(--blue2), var(--blue) 60%);
            animation: girar 5s linear infinite;
            box-shadow: var(--shadow);
        }
        @keyframes girar { to { --angle: 360deg; } }
        .login-inner {
            background: var(--white);
            border-radius: 18px;
            padding: 36px 32px;
        }
        .login-logo {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--blue), var(--blue2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 20px;
            box-shadow: var(--shadow-colored);
        }
        .login-inner h2 { margin-bottom: 4px; font-weight: 700; }
        .login-sub {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 24px;
            font-weight: 500;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--txt);
            margin-bottom: 6px;
        }
        .login-error {
            font-size: 13px;
            color: var(--red);
            text-align: center;
            min-height: 18px;
            font-weight: 600;
        }
        @media (prefers-reduced-motion: reduce) { #login-view { animation: none; } }
        .hidden { display: none !important; }

        /* Estilos de la aplicación interna */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .user-profile span { font-weight: 700; color: var(--blue); }
        .btn-outline {
            background-color: transparent;
            color: var(--red);
            border: 1px solid var(--red-soft);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: none;
        }
        .btn-outline:hover { background-color: var(--red-soft); box-shadow: none; }
        nav { display: flex; gap: 8px; margin-bottom: 20px; }
        .nav-link {
            text-decoration: none;
            color: var(--muted);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 13.5px;
        }
        .nav-link.active { background: var(--blue-soft); color: var(--blue); }
        .subview {
            background: var(--bg);
            padding: 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .datos-estado { color: var(--muted); font-size: 14px; }
        .tabla-activos { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .tabla-activos th, .tabla-activos td {
            text-align: left;
            padding: 10px 10px;
            border-bottom: 1px solid var(--border);
        }
        .tabla-activos th { color: var(--txt); font-weight: 700; }
        .estado-badge {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }
        .estado-activo { background: var(--green-soft); color: #1a7a52; }
        .estado-baja { background: var(--red-soft); color: #c11c46; }
        .estado-mantenimiento { background: var(--amber-soft); color: #92670e; }
    </style>
</head>
<body>

    <!-- 1. VISTA DE INICIO DE SESIÓN -->
    <div id="login-view">
        <div class="login-inner">
            <div class="login-logo">SB</div>
            <h2>Iniciar Sesión</h2>
            <p class="login-sub">Ingresa con tu cuenta para continuar</p>
            <form>
                <div class="field">
                    <label for="login-email">Usuario</label>
                    <input id="login-email" type="text" placeholder="Ej. FGUERRERO" required autocomplete="username">
                </div>
                <div class="field">
                    <label for="login-password">Contraseña</label>
                    <input id="login-password" type="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <p class="login-error"></p>
                <button type="submit">Iniciar sesión</button>
            </form>
        </div>
    </div>

    <!-- 2. VISTA DE LA APLICACIÓN PRINCIPAL (OCULTA HASTA LOGUEARSE) -->
    <div id="app-view" class="container hidden">
        <header>
            <div class="user-profile">Usuario activo: <span></span></div>
            <div class="nav-right">
                <button class="btn-outline">Cerrar Sesión</button>
            </div>
        </header>

        <nav>
            <a href="#" class="nav-link active" data-target="vista-inicio">Inicio</a>
            <a href="#" class="nav-link" data-target="vista-datos">Datos</a>
        </nav>

        <!-- Subvistas intercambiables -->
        <div id="vista-inicio" class="subview">
            <h3>Panel Principal</h3>
            <p>¡Conexión exitosa! Has ingresado correctamente al entorno integrado con Supabase.</p>
        </div>

        <div id="vista-datos" class="subview hidden">
            <h3>Activos por Tienda</h3>
            <p id="activos-estado" class="datos-estado">Cargando activos...</p>
            <table id="activos-tabla" class="tabla-activos hidden">
                <thead>
                    <tr>
                        <th>Tienda</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>N° Serie</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Carga del SDK oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>

    <script>
        // --- CONFIGURACIÓN DE CREDENCIALES ---
        // ¡¡IMPORTANTE!!: Pega aquí tus claves reales de Supabase (Settings > API)
        const supabaseUrl = 'https://xlygkolfmetytowixtnb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_qMc5NuOO1HUzYvQzFEr2fA_vVqBzXND';

        // Evita que el script truene si aún quedan los valores de ejemplo
        const credencialesValidas = /^https:\/\/.+\.supabase\.co$/.test(supabaseUrl) && supabaseAnonKey.length > 20;

        let supabaseClient = null;
        if (credencialesValidas) {
            try {
                supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
            } catch (err) {
                console.error('No se pudo inicializar Supabase:', err);
            }
        } else {
            console.warn('Supabase no está configurado: reemplaza supabaseUrl y supabaseAnonKey con tus claves reales.');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loginView = document.getElementById('login-view');
            const appView = document.getElementById('app-view');
            const loginForm = document.querySelector('#login-view form');
            const logoutBtn = document.querySelector('.nav-right .btn-outline');
            const userEmailDisplay = document.querySelector('.user-profile span');

            if (!supabaseClient) {
                const errorMsg = loginForm ? loginForm.querySelector('.login-error') : null;
                if (errorMsg) errorMsg.textContent = 'Falta configurar Supabase (URL/clave) en el código.';
                const submitBtn = loginForm ? loginForm.querySelector('button[type="submit"]') : null;
                if (submitBtn) submitBtn.disabled = true;
                return;
            }

            // --- GESTIÓN DE SESIÓN ACTIVA ---
            supabaseClient.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    mostrarApp(session.user);
                }
            });

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                if (session) {
                    mostrarApp(session.user);
                } else {
                    mostrarLogin();
                }
            });

            // --- LOGIN DE USUARIOS ---
            const DOMINIO_INTERNO = 'kurodaapp.local'; // dominio invisible para el usuario
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const usuarioInput = document.getElementById('login-email').value.trim().toLowerCase();
                    const passwordInput = loginForm.querySelector('input[type="password"]').value;
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    const errorMsg = loginForm.querySelector('.login-error');

                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Autenticando...';
                    if (errorMsg) errorMsg.textContent = '';

                    const emailInterno = `${usuarioInput}@${DOMINIO_INTERNO}`;

                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: emailInterno,
                        password: passwordInput,
                    });

                    if (error) {
                        if (errorMsg) errorMsg.textContent = 'No se pudo iniciar sesión. Verifica tus datos.';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Iniciar sesión';
                    }
                });
            }

            // --- LOGOUT DE USUARIOS ---
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    await supabaseClient.auth.signOut();
                });
            }

            // --- MANIPULACIÓN DEL DOM PARA INTERCAMBIO DE VISTAS ---
            function mostrarApp(user) {
                if(loginView) loginView.classList.add('hidden');
                if(appView) appView.classList.remove('hidden');
                if(userEmailDisplay) userEmailDisplay.textContent = user.email.split('@')[0].toUpperCase();
            }

            function mostrarLogin() {
                if(appView) appView.classList.add('hidden');
                if(loginView) loginView.classList.remove('hidden');
                if(loginForm) {
                    loginForm.reset();
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    const errorMsg = loginForm.querySelector('.login-error');
                    if(submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Iniciar sesión';
                    }
                    if(errorMsg) errorMsg.textContent = '';
                }
            }

            // --- NAVEGACIÓN INTERNA ---
            const navLinks = document.querySelectorAll('.nav-link');
            const subviews = document.querySelectorAll('.subview');
            let activosCargados = false;

            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetId = link.getAttribute('data-target');
                    if (!targetId) return;

                    navLinks.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');

                    subviews.forEach(view => view.classList.add('hidden'));
                    const targetView = document.getElementById(targetId);
                    if(targetView) targetView.classList.remove('hidden');

                    if (targetId === 'vista-datos' && !activosCargados) {
                        activosCargados = true;
                        cargarActivos();
                    }
                });
            });

            // --- CARGA DE ACTIVOS (tabla "activos", filtrada por RLS/razón social) ---
            async function cargarActivos() {
                const estado = document.getElementById('activos-estado');
                const tabla = document.getElementById('activos-tabla');
                const tbody = tabla ? tabla.querySelector('tbody') : null;

                const { data, error } = await supabaseClient
                    .from('activos')
                    .select('tienda, nombre, tipo, numero_serie, estado')
                    .order('tienda', { ascending: true });

                if (error) {
                    if (estado) estado.textContent = 'No se pudo cargar el listado de activos.';
                    console.error('Error al cargar activos:', error);
                    return;
                }

                if (!data || data.length === 0) {
                    if (estado) estado.textContent = 'Todavía no hay activos registrados.';
                    return;
                }

                if (tbody) {
                    tbody.innerHTML = data.map(a => `
                        <tr>
                            <td>${a.tienda ?? ''}</td>
                            <td>${a.nombre ?? ''}</td>
                            <td>${a.tipo ?? '-'}</td>
                            <td>${a.numero_serie ?? '-'}</td>
                            <td><span class="estado-badge estado-${a.estado}">${a.estado}</span></td>
                        </tr>
                    `).join('');
                }
                if (estado) estado.classList.add('hidden');
                if (tabla) tabla.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
